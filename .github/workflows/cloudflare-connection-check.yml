name: Check Cloudflare deployment connection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-connection-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check connection presence only
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare deployment connection: AVAILABLE"
          else
            echo "Cloudflare deployment connection: MISSING"
            exit 2
          fi
